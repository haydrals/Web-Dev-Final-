<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Learning Game</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);

      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .menu {
      display: flex;
      flex-direction: column;
      align-items: center;

      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 320px;
      text-align: center;

      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;

      background: #3498db;
      color: white;
      font-size: 16px;
      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {
      background: #2980b9;
    }
  </style>
</head>

<body>

  <div class="menu">
    <h1>Language Game</h1>

    <button onclick="goTo('vocab.html')">Vocabulary Quiz</button>
    <button onclick="goTo('listening.html')">Listening Mode</button>
    <button onclick="goTo('typing.html')">Typing Challenge</button>
    <button onclick="goTo('flashcard.html')">FlashCards</button>
  </div>

  <script src="script.js"></script>
</body>

</html>
